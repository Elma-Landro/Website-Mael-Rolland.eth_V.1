<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Au-delà des codes — Lecteur de thèse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════
   VARIABLES — charte mael-rolland.eth
═══════════════════════════════════════════════════════ */
:root {
  --bg:        #4d0000;
  --bg2:       #3a0000;
  --bg3:       #5a0000;
  --border:    #ffaa33;
  --gold:      #ffd700;
  --gold2:     #ffcc66;
  --gold-dim:  #aa7700;
  --text:      #ffcc66;
  --text2:     #ffaa33;
  --accent:    #ff6600;
  --danger:    #ff4444;
  --success:   #33ff33;
  --pixel:     'Press Start 2P', monospace;
  --body:      'Courier Prime', 'Courier New', monospace;
  --reader-w:  66%;
  --graph-w:   34%;
  --header-h:  52px;
  --sidebar-w: 240px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
}

/* ── SCANLINES effect ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
}

/* ═══ HEADER ═══════════════════════════════════════════ */
.site-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--header-h);
  background: var(--bg2);
  border-bottom: 2px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 0 20px;
}

.site-logo {
  font-family: var(--pixel);
  font-size: 0.7em;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(255,215,0,0.4);
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.site-subtitle {
  font-family: var(--pixel);
  font-size: 0.45em;
  color: var(--gold2);
  white-space: nowrap;
}

.header-sep {
  flex: 1;
}

/* Language toggle */
.lang-toggle {
  display: flex; gap: 4px;
}
.lang-btn {
  font-family: var(--pixel);
  font-size: 0.5em;
  padding: 4px 8px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--gold2);
  cursor: pointer;
  transition: all 0.15s;
}
.lang-btn.active {
  background: var(--gold);
  color: var(--bg);
  border-color: var(--gold);
}
.lang-btn:hover:not(.active) {
  border-color: var(--gold);
  color: var(--gold);
}

/* Chapter nav */
.chapter-nav {
  display: flex; gap: 2px;
}
.ch-btn {
  font-family: var(--pixel);
  font-size: 0.45em;
  padding: 4px 10px;
  background: transparent;
  border: 1px solid var(--gold-dim);
  color: var(--gold-dim);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.ch-btn.active {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(255,215,0,0.08);
}
.ch-btn:hover {
  border-color: var(--gold2);
  color: var(--gold2);
}

/* Back link */
.back-link {
  font-family: var(--pixel);
  font-size: 0.45em;
  color: var(--gold2);
  text-decoration: none;
  border: 1px solid var(--gold-dim);
  padding: 4px 8px;
  transition: all 0.15s;
}
.back-link:hover {
  color: var(--gold);
  border-color: var(--gold);
}

/* ═══ MAIN LAYOUT ════════════════════════════════════== */
.main-layout {
  display: flex;
  height: 100vh;
  padding-top: var(--header-h);
}

/* ═══ TOC SIDEBAR ═══════════════════════════════════════ */
.toc-sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 0;
  display: flex;
  flex-direction: column;
}

.toc-title {
  font-family: var(--pixel);
  font-size: 0.5em;
  color: var(--gold2);
  letter-spacing: 0.1em;
  padding: 0 16px 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}

.toc-chapter {
  padding: 6px 16px;
  font-family: var(--pixel);
  font-size: 0.42em;
  color: var(--gold2);
  letter-spacing: 0.05em;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  line-height: 1.6;
}
.toc-chapter:hover { color: var(--gold); background: rgba(255,215,0,0.05); }
.toc-chapter.active { color: var(--gold); border-left-color: var(--gold); background: rgba(255,215,0,0.08); }

.toc-section {
  padding: 4px 16px 4px 28px;
  font-family: var(--body);
  font-size: 0.75em;
  color: var(--text2);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.15s;
  line-height: 1.4;
}
.toc-section:hover { color: var(--text); background: rgba(255,215,0,0.03); }
.toc-section.active { color: var(--gold2); border-left-color: var(--gold2); }

/* ═══ READER COLUMN ════════════════════════════════════ */
.reader-col {
  flex: 1;
  overflow-y: auto;
  padding: 40px 48px 80px;
  scroll-behavior: smooth;
  background: var(--bg);
}

/* Typography */
.reader-content h1 {
  font-family: var(--pixel);
  font-size: 0.85em;
  color: var(--gold);
  margin: 48px 0 24px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--border);
  line-height: 1.6;
  letter-spacing: 0.05em;
}
.reader-content h2 {
  font-family: var(--pixel);
  font-size: 0.65em;
  color: var(--gold2);
  margin: 36px 0 18px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--gold-dim);
  line-height: 1.6;
  letter-spacing: 0.04em;
}
.reader-content h3 {
  font-family: var(--pixel);
  font-size: 0.52em;
  color: var(--text);
  margin: 28px 0 14px;
  line-height: 1.6;
}
.reader-content h4 {
  font-family: var(--body);
  font-size: 1em;
  font-weight: 700;
  color: var(--gold2);
  margin: 20px 0 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.reader-content p {
  line-height: 1.85;
  margin-bottom: 1.2em;
  color: var(--text);
  font-size: 0.95em;
  text-align: justify;
}

.reader-content blockquote {
  border-left: 1px solid var(--gold);
  padding: 6px 22px;
  margin: 28px 8%;
  background: transparent;
  font-style: italic;
  color: var(--text2);
  font-size: 0.86em;
  line-height: 1.75;
  letter-spacing: 0.01em;
}

.reader-content em { color: var(--text); font-style: italic; }
.reader-content strong { color: var(--gold2); font-weight: 700; }

.reader-content a {
  color: var(--gold2);
  text-decoration: underline dotted;
  transition: color 0.15s;
}
.reader-content a:hover { color: var(--gold); }

.reader-content code {
  font-family: var(--body);
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 1px 5px;
  font-size: 0.88em;
  color: var(--accent);
}

.reader-content sup {
  font-size: 0.7em;
  color: var(--gold2);
  cursor: pointer;
}
.reader-content sup.fn-ref {
  font-family: var(--pixel);
  font-size: 0.5em;
  color: var(--text2);
  background: rgba(255,170,51,0.12);
  padding: 1px 3px;
  border-radius: 2px;
  vertical-align: super;
  white-space: nowrap;
}

.reader-content img {
  max-width: 100%;
  height: auto;
  border: 1px solid var(--border);
  display: block;
  margin: 20px auto;
}

/* Entity highlight */
.entity-mention {
  background: rgba(255,215,0,0.12);
  border-bottom: 1px solid var(--gold2);
  color: var(--gold);
  cursor: pointer;
  padding: 0 2px;
  border-radius: 0;
  transition: background 0.15s;
}
.entity-mention:hover {
  background: rgba(255,215,0,0.25);
}

/* Section anchor */
.section-anchor {
  display: block;
  height: 1px;
  margin-top: -var(--header-h);
}

/* Loading state */
.loading-msg {
  font-family: var(--pixel);
  font-size: 0.6em;
  color: var(--gold2);
  text-align: center;
  padding: 60px 20px;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Footnotes section */
.footnotes-section {
  margin-top: 60px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  font-size: 0.82em;
  color: var(--text2);
  line-height: 1.6;
}
.fn-title {
  font-family: var(--pixel);
  font-size: 0.55em;
  color: var(--gold2);
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}
.footnotes-section ol { padding-left: 20px; }
.footnotes-section li { margin-bottom: 8px; }
.fn-back {
  color: var(--text2);
  text-decoration: none;
  font-size: 0.85em;
  opacity: 0.7;
}
.fn-back:hover { color: var(--gold); opacity: 1; }

/* ═══ GRAPH COLUMN ══════════════════════════════════════ */
.graph-col {
  width: 360px;
  flex-shrink: 0;
  background: var(--bg2);
  border-left: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.graph-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
  flex-shrink: 0;
}

.graph-header-title {
  font-family: var(--pixel);
  font-size: 0.45em;
  color: var(--gold);
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.graph-section-name {
  font-family: var(--body);
  font-size: 0.75em;
  color: var(--text2);
  line-height: 1.3;
  min-height: 1.3em;
}

/* Type filters */
.graph-filters {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 4px;
  flex-shrink: 0;
  max-height: 90px;
  overflow-y: auto;
}

.filter-chip {
  font-family: var(--pixel);
  font-size: 0.38em;
  padding: 3px 6px;
  border: 1px solid;
  cursor: pointer;
  opacity: 0.5;
  transition: opacity 0.15s;
}
.filter-chip.on { opacity: 1; }

/* Graph canvas */
#cy-reader {
  flex: 1;
  width: 100%;
  min-height: 0;
}

/* Graph stats */
.graph-stats {
  padding: 6px 14px;
  border-top: 1px solid var(--border);
  font-family: var(--pixel);
  font-size: 0.38em;
  color: var(--gold-dim);
  display: flex; justify-content: space-between;
  flex-shrink: 0;
}

/* ═══ ENTITY PANEL ══════════════════════════════════════ */
.entity-panel {
  position: fixed;
  top: var(--header-h);
  right: 0;
  width: 380px;
  height: calc(100vh - var(--header-h));
  background: var(--bg2);
  border-left: 2px solid var(--gold);
  transform: translateX(100%);
  transition: transform 0.3s ease;
  z-index: 200;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.entity-panel.open { transform: translateX(0); }

.panel-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: flex-start;
  flex-shrink: 0;
  background: var(--bg3);
}

.panel-entity-name {
  font-family: var(--pixel);
  font-size: 0.55em;
  color: var(--gold);
  line-height: 1.6;
  flex: 1;
  margin-right: 12px;
}

.panel-entity-type {
  font-family: var(--pixel);
  font-size: 0.4em;
  padding: 3px 7px;
  border: 1px solid;
  flex-shrink: 0;
}

.panel-close {
  font-family: var(--pixel);
  font-size: 0.5em;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--gold2);
  cursor: pointer;
  padding: 4px 8px;
  margin-left: 8px;
  flex-shrink: 0;
}
.panel-close:hover { border-color: var(--gold); color: var(--gold); }

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.panel-desc {
  font-family: var(--body);
  font-size: 0.88em;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.panel-attrs {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.panel-attr-title {
  font-family: var(--pixel);
  font-size: 0.42em;
  color: var(--gold2);
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}
.panel-attr-block {
  font-family: var(--body);
  font-size: 0.85em;
  color: var(--text);
  line-height: 1.6;
  background: rgba(255,204,102,0.06);
  border-left: 2px solid var(--gold2);
  padding: 8px 10px;
  margin-bottom: 8px;
  border-radius: 0 4px 4px 0;
}
.panel-attr-key {
  font-family: var(--pixel);
  font-size: 0.75em;
  color: var(--gold2);
  text-transform: uppercase;
  display: block;
  margin-bottom: 4px;
  letter-spacing: 0.06em;
}

.panel-relations-title {
  font-family: var(--pixel);
  font-size: 0.42em;
  color: var(--gold2);
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}

.panel-relation {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(139,96,0,0.3);
  cursor: pointer;
  transition: background 0.1s;
}
.panel-relation:hover { background: rgba(255,215,0,0.04); }

.rel-arrow {
  font-family: var(--pixel);
  font-size: 0.4em;
  color: var(--gold-dim);
  flex-shrink: 0;
  margin-top: 2px;
  min-width: 14px;
}

.rel-type {
  font-family: var(--pixel);
  font-size: 0.38em;
  color: var(--gold2);
  flex-shrink: 0;
  background: var(--bg3);
  padding: 2px 5px;
  border: 1px solid var(--border);
  margin-top: 1px;
}

.rel-target {
  font-family: var(--body);
  font-size: 0.82em;
  color: var(--text);
  line-height: 1.3;
}

/* ═══ READING PROGRESS BAR ══════════════════════════════ */
.reading-progress {
  position: fixed;
  top: var(--header-h);
  left: var(--sidebar-w);
  right: 360px;
  height: 3px;
  width: 0%;
  background: linear-gradient(90deg, var(--gold2), var(--accent));
  z-index: 150;
  transition: width 0.1s linear;
  pointer-events: none;
}

/* ═══ GRAPH SECTION TOTAL ═══════════════════════════════ */
.graph-section-total {
  font-family: var(--pixel);
  font-size: 0.35em;
  color: var(--gold-dim);
  margin-top: 3px;
  letter-spacing: 0.06em;
}

/* ═══ SCROLLBAR ═════════════════════════════════════════ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); }
::-webkit-scrollbar-thumb:hover { background: var(--gold2); }

/* ═══ RESPONSIVE ════════════════════════════════════════ */
@media (max-width: 900px) {
  .toc-sidebar { display: none; }
  .graph-col { width: 280px; }
}
@media (max-width: 640px) {
  .graph-col { display: none; }
}

/* ═══ MOBILE (≤ 768px) ══════════════════════════════════ */
@media (max-width: 768px) {
  /* Header : scrollable horizontalement, hauteur auto */
  .site-header {
    height: auto;
    min-height: var(--header-h);
    padding: 8px 12px;
    flex-wrap: wrap;
    gap: 6px;
    overflow-x: auto;
    overflow-y: visible;
  }
  /* Masquer le sous-titre long */
  .site-subtitle { display: none; }
  /* Logo plus compact */
  .site-logo { font-size: 0.55em; }
  /* Navigation chapitres : scroll horizontal */
  .chapter-nav {
    order: 10;
    width: 100%;
    overflow-x: auto;
    padding-bottom: 4px;
    gap: 3px;
    flex-wrap: nowrap;
  }
  /* Layout : pas de padding-top fixe, laisser espace au header */
  .main-layout {
    padding-top: 0;
    margin-top: var(--header-h);
    height: calc(100vh - var(--header-h));
  }
  /* Reader : padding réduit */
  .reader-col {
    padding: 20px 16px 60px;
  }
  /* Texte : pas de justify sur mobile (espacement catastrophique) */
  .reader-content p {
    text-align: left;
    font-size: 0.9em;
    line-height: 1.75;
  }
  .reader-content h1 { font-size: 0.7em; }
  .reader-content h2 { font-size: 0.55em; }
  .reader-content h3 { font-size: 0.45em; }
}
</style>
</head>
<body>

<!-- ══ HEADER ════════════════════════════════════════════ -->
<header class="site-header">
  <a href="these.html" class="back-link">← Thèse</a>
  <div>
    <div class="site-logo">◈ Au-delà des codes</div>
    <div class="site-subtitle">Lecteur de thèse · Maël Rolland (EHESS, 2024)</div>
  </div>

  <nav class="chapter-nav" id="chapter-nav">
    <!-- populated by JS -->
  </nav>

  <div class="header-sep"></div>

  <div class="lang-toggle">
    <button class="lang-btn active" id="btn-fr" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</header>

<!-- Reading progress -->
<div class="reading-progress" id="reading-progress"></div>

<!-- ══ MAIN ══════════════════════════════════════════════ -->
<div class="main-layout">

  <!-- TOC -->
  <nav class="toc-sidebar" id="toc-sidebar">
    <div class="toc-title">TABLE DES MATIÈRES</div>
    <div id="toc-content"><!-- populated --></div>
  </nav>

  <!-- Reader -->
  <main class="reader-col" id="reader-col">
    <div class="reader-content" id="reader-content">
      <div class="loading-msg">Chargement…</div>
    </div>
  </main>

  <!-- Graph -->
  <aside class="graph-col">
    <div class="graph-header">
      <div class="graph-header-title">◈ GRAPHE CONTEXTUEL</div>
      <div class="graph-section-name" id="graph-section-name">—</div>
      <div class="graph-section-total" id="graph-section-total"></div>
    </div>
    <div class="graph-filters" id="graph-filters"><!-- populated --></div>
    <div id="cy-reader"></div>
    <div class="graph-stats">
      <span id="stat-nodes">0 nœuds</span>
      <span id="stat-edges">0 liens</span>
    </div>
  </aside>

</div>

<!-- ══ ENTITY PANEL ═══════════════════════════════════════ -->
<div class="entity-panel" id="entity-panel">
  <div class="panel-header">
    <div>
      <div class="panel-entity-name" id="panel-name">—</div>
      <div class="panel-entity-type" id="panel-type">—</div>
    </div>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div class="panel-desc" id="panel-desc">—</div>
    <div id="panel-attrs"></div>
    <div class="panel-relations-title">RELATIONS</div>
    <div id="panel-relations">—</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIGURATION
// ═══════════════════════════════════════════════════════
const BASE            = './assets/MD/';
const GRAPH_FILE      = './grc20-these-mael-rolland-v79.json';
const SECTION_MAP_FILE= './section_entities_map.json';
const MAX_GRAPH_NODES = 12;   // max nodes in graph (paragraph-level scrollytelling)
const MAX_HIGHLIGHT   = 150;  // max entity names for DOM highlighting

const CHAPTERS_DEF = [
  { id: 'intro',    labelFR: 'Intro',      labelEN: 'Intro',
    fileFR: '00_introduction.md',      fileEN: '00_introduction_EN.md' },
  { id: 'ch1',      labelFR: 'Chap. I',   labelEN: 'Ch. I',
    fileFR: '01_chapitre_I.md',        fileEN: '01_chapitre_I_EN.md' },
  { id: 'ch2',      labelFR: 'Chap. II',  labelEN: 'Ch. II',
    fileFR: '02_chapitre_II.md',       fileEN: '02_chapitre_II_EN.md' },
  { id: 'ch3',      labelFR: 'Chap. III', labelEN: 'Ch. III',
    fileFR: '03_chapitre_III.md',      fileEN: '03_chapitre_III_EN.md' },
  { id: 'ccl',      labelFR: 'Conclusion',labelEN: 'Conclusion',
    fileFR: '04_conclusion.md',        fileEN: '04_conclusion_EN.md' },
  { id: 'glossaire',labelFR: 'Glossaire', labelEN: 'Glossary',
    fileFR: '05_glossaire_annexes.md', fileEN: '05_glossary_appendix_en.md' },
];

// ═══════════════════════════════════════════════════════
//  STATE

let state = {

// ═══════════════════════════════════════════════════════
//  DATA LOADING (graph + section map in parallel)
// ═══════════════════════════════════════════════════════
async function loadGraph() {
  try {
    const [graphRes, sectionRes, overrideRes] = await Promise.all([
      fetch(GRAPH_FILE),
      fetch(SECTION_MAP_FILE),
      fetch('./section_overrides.json').catch(() => null),
    ]);
    const [data, sectionMap] = await Promise.all([
      graphRes.json(),
      sectionRes.json(),
    ]);
    if (overrideRes?.ok) state.sectionOverrides = await overrideRes.json();

    state.graphData          = data;
    state.sectionEntitiesMap = sectionMap;

    // ── Compute TF-IDF scores ──────────────────────────────────────────
    // tf(e, s)  = raw occurrence_count of entity e in section s
    // idf(e)    = log(total_sections / df(e))  — penalises ubiquitous entities
    // tfidf     = tf × idf  (stored once, used at every graph update)
    const allSections    = Object.keys(sectionMap);
    const totalSections  = allSections.length || 1;
    const df = {};   // entity_id → number of sections that mention it
    for (const secData of Object.values(sectionMap)) {
      for (const { entity_id } of (secData.entities || [])) {
        df[entity_id] = (df[entity_id] || 0) + 1;
      }
    }
    const tfidf = {};
    for (const [secKey, secData] of Object.entries(sectionMap)) {
      tfidf[secKey] = {};
      for (const { entity_id, occurrence_count } of (secData.entities || [])) {
        const idf = Math.log(totalSections / (df[entity_id] || 1));
        tfidf[secKey][entity_id] = occurrence_count * idf;
      }
    }
    state.tfidfScores = tfidf;
    // ──────────────────────────────────────────────────────────────────
    state.typeMap    = Object.fromEntries(data.types.map(t => [t.id, t.name]));
    state.relTypeMap = Object.fromEntries(data.relation_types.map(r => [r.id, r.name]));
    state.entityMap  = Object.fromEntries(data.entities.map(e => [e.id, e]));

    // Adjacency list (needed for entity panel relations)
    const adj = {};
    for (const e of data.entities) adj[e.id] = [];
    for (const r of data.relations) {
      const rname = state.relTypeMap[r.type] || r.type;
      adj[r.from]?.push({ nid: r.to,   relName: rname, dir: 'out' });
      adj[r.to  ]?.push({ nid: r.from, relName: rname, dir: 'in'  });
    }
    state.adjacency = adj;

    // Build type filter list from entities present in graph
    const presentTypes = new Set();
    for (const e of data.entities) {
      for (const t of (e.types || [])) {
        const tn = state.typeMap[t];
        if (tn && !['Chapter','ThesisSection','SourceQuote'].includes(tn)) presentTypes.add(tn);
      }
    }
    state.activeFilters = new Set(presentTypes);
    renderFilters(presentTypes);

  } catch (err) {
    console.warn('Data loading error:', err);
  }
}

// ═══════════════════════════════════════════════════════
//  SECTION KEY MAPPING
//  Maps heading text → key in section_entities_map.json
//  Keys: 'intro_A'…'intro_E', 'I.1', 'I.1.1', 'II.3', …
// ═══════════════════════════════════════════════════════
function headingToSectionKey(text, chapterId) {
  const clean = text.replace(/<[^>]+>/g, '').trim();

  // Roman numeral + digits: "I.1", "I.1.1", "II.3.2", "III.4"
  const roman = clean.match(/^([IVX]{1,4}\.\d+(?:\.\d+)?(?:\.\d+)?)/);
  if (roman) return roman[1];

  // Intro sub-sections: "A.", "A —", "A. Titre", lone "A"
  if (chapterId === 'intro') {
    const letter = clean.match(/^([A-E])(?:[.\s\u2014\-]|$)/);
    if (letter) return 'intro_' + letter[1];
  }

  return null;
}

// ═══════════════════════════════════════════════════════
//  GRAPH UPDATE — uses section_entities_map.json directly
// ═══════════════════════════════════════════════════════
let _graphTimer = null;
function debouncedUpdateGraph(sectionKey) {
  clearTimeout(_graphTimer);
  _graphTimer = setTimeout(() => updateGraph(sectionKey), 250);
}

function updateGraph(sectionKey) {
  if (!state.cy || !state.graphData || !state.sectionEntitiesMap) return;
  if (!sectionKey || sectionKey === state.currentSectionKey) return;
  state.currentSectionKey = sectionKey;

  const sectionData = state.sectionEntitiesMap[sectionKey];
  document.getElementById('graph-section-name').textContent = sectionKey;

  if (!sectionData?.entities?.length) {
    state.cy.elements().remove();
    document.getElementById('stat-nodes').textContent      = '0 nœuds';
    document.getElementById('stat-edges').textContent      = '0 liens';
    document.getElementById('graph-section-total').textContent = '';
    return;
  }

  // ── Select entities: overrides first, then TF-IDF top-N ──────────────
  const scores      = state.tfidfScores?.[sectionKey] || {};
  const overrideIds = state.sectionOverrides?.[sectionKey] || [];
  const overrideSet = new Set(overrideIds);

  const byScore = [...sectionData.entities]
    .filter(e => !overrideSet.has(e.entity_id))
    .sort((a, b) => (scores[b.entity_id] || 0) - (scores[a.entity_id] || 0))
    .slice(0, MAX_GRAPH_NODES - overrideIds.length)
    .map(e => e.entity_id);

  const finalIds  = [...overrideIds, ...byScore];
  const entityIdSet = new Set(finalIds);
  const maxScore  = Math.max(...finalIds.map(id => scores[id] || 0), 1);

  // Build nodes — size proportional to TF-IDF score; overrides always largest
  const newNodes = [];
  for (const entity_id of finalIds) {
    const entity = state.entityMap[entity_id];
    if (!entity) continue;
    const typeName = (entity.types || []).map(t => state.typeMap[t]).find(t => t) || 'Unknown';
    const score    = scores[entity_id] || 0;
    const isPin    = overrideSet.has(entity_id);
    newNodes.push({
      data: {
        id:     entity_id,
        label:  truncate(entity.name, 18),
        color:  TYPE_COLORS[typeName] || '#6b5000',
        type:   typeName,
        size:   isPin ? 36 : 12 + (score / maxScore) * 24,
        weight: score,
      }
    });
  }

  // Build edges only between entities present in the subgraph
  const newEdges = [];
  const edgeSet  = new Set();
  for (const r of state.graphData.relations) {
    if (entityIdSet.has(r.from) && entityIdSet.has(r.to)) {
      const key = `${r.from}|${r.to}|${r.type}`;
      if (!edgeSet.has(key)) {
        edgeSet.add(key);
        newEdges.push({ data: { id: key, source: r.from, target: r.to, label: state.relTypeMap[r.type] || '' } });
      }
    }
  }

  smoothUpdateGraph(newNodes, newEdges);

  document.getElementById('stat-nodes').textContent = `${newNodes.length} nœuds`;
  document.getElementById('stat-edges').textContent = `${newEdges.length} liens`;
  const total = sectionData.entities.length;
  document.getElementById('graph-section-total').textContent =
    total > newNodes.length ? `top ${newNodes.length}/${total} entités` : `${newNodes.length} entités`;
}

function smoothUpdateGraph(newNodes, newEdges) {
  const cy         = state.cy;
  const newNodeIds = new Set(newNodes.map(n => n.data.id));
  const newEdgeIds = new Set(newEdges.map(e => e.data.id));

  // Remove elements absent from new subgraph
  cy.elements().filter(el => !newNodeIds.has(el.id()) && !newEdgeIds.has(el.id())).remove();

  // Add genuinely new elements — hide until layout positions them
  const existingIds = new Set(cy.elements().map(el => el.id()));
  const toAdd = [
    ...newNodes.filter(n => !existingIds.has(n.data.id)),
    ...newEdges.filter(e => !existingIds.has(e.data.id)),
  ];
  // Add at full opacity — no layoutstop race condition
  if (toAdd.length) cy.add(toAdd);

  applyFilters();

  if (cy.nodes(':visible').length > 0) {
    cy.layout({
      name:              'cose',
      animate:           true,
      animationDuration: 450,
      animationEasing:   'ease-out',
      randomize:         true,   // random start positions → prevents stacking at (0,0)
      nodeRepulsion:     14000,
      edgeElasticity:    80,
      gravity:           0.5,
      numIter:           200,
      initialTemp:       300,
      coolingFactor:     0.95,
      minTemp:           1.0,
      fit:               true,
      padding:           24,
    }).run();
  }
}

async function loadChapter(chapterId) {
  state.currentChapter    = chapterId;
  state.currentSectionKey = null;
  if (state.observer)        state.observer.disconnect();
  if (state.headingObserver) state.headingObserver.disconnect();
  updateChapterNav();

  const def  = CHAPTERS_DEF.find(c => c.id === chapterId);
  if (!def) return;

  const file = state.lang === 'en' && def.fileEN ? def.fileEN : def.fileFR;
  if (!file) {
    document.getElementById('reader-content').innerHTML =
      `<p style="color:var(--gold2);font-family:var(--pixel);font-size:0.6em;padding:40px">Traduction en cours…</p>`;
    return;
  }

  document.getElementById('reader-content').innerHTML = `<div class="loading-msg">Chargement…</div>`;

  try {
    const res = await fetch(BASE + file);
    if (!res.ok) throw new Error(res.status);
    renderMarkdown(await res.text());
    buildTOC();
    setupIntersectionObserver();
    // Trigger graph for first mapped section
    const firstKeyed = document.querySelector('.reader-content [data-section-key]');
    if (firstKeyed?.dataset.sectionKey) updateGraph(firstKeyed.dataset.sectionKey);
  } catch (err) {
    document.getElementById('reader-content').innerHTML =
      `<p style="color:var(--danger);font-family:var(--pixel);font-size:0.6em;padding:40px">
        Fichier non trouvé : assets/MD/${file}
      </p>`;
    console.error(err);
  }
}

function renderMarkdown(md) {
  let cleaned = md
    .replace(/\{[^}]*width=[^}]*\}/g, '')
    .replace(/!\[([^\]]*)\]\(media\/(image\d+\.\w+)\)/g, '![$1](assets/figures/$2)')
    .replace(/^\[.*?\]\(#.*?\)\n/gm, '');

  // Extract footnote definitions
  const footnoteDefs = {};
  cleaned = cleaned.replace(/^\[\^(\d+)\]:\s*(.+)$/gm, (_, n, text) => {
    footnoteDefs[parseInt(n)] = text.trim();
    return '';
  });

  // Remove ##### sidenotes (Pandoc artifact)
  cleaned = cleaned.replace(/^#{5}\s+.+$/gm, '');

  // Inline footnote refs
  cleaned = cleaned.replace(/\[\^(\d+)\]/g,
    '<sup id="fnref-$1"><a href="#fn-$1" class="fn-ref">[$1]</a></sup>');

  // Zotero → Google Scholar
  const zoteroRe = /\[([^\]]+)\]\(https?:\/\/(?:www\.)?zotero\.org\/google-docs\/[^)]+\)/g;
  const zoteroFn = (_, text) => {
    const q = encodeURIComponent(text.replace(/[()[\]]/g, '').trim());
    return `[${text}](https://scholar.google.com/scholar?q=${q})`;
  };
  cleaned = cleaned.replace(zoteroRe, zoteroFn);

  // Pandoc superscripts
  cleaned = cleaned.replace(/\^([^^]+?)\^/g, '<sup>$1</sup>');

  marked.setOptions({ breaks: true, gfm: true });
  let html = marked.parse(cleaned);

  // Attach data-section and data-section-key to h1/h2 for IntersectionObserver
  html = html.replace(/<(h[12])(.*?)>(.*?)<\/h[12]>/gs, (m, tag, attrs, content) => {
    const text       = content.replace(/<[^>]+>/g, '');
    const slug       = slugify(text);
    const sectionKey = headingToSectionKey(text, state.currentChapter) || '';
    const keyAttr    = sectionKey ? ` data-section-key="${sectionKey}"` : '';
    return `<${tag}${attrs}${keyAttr} data-section="${text}" id="section-${slug}">${content}</${tag}>`;
  });

  // Footnotes section
  const fnNums = Object.keys(footnoteDefs).map(Number).sort((a, b) => a - b);
  if (fnNums.length) {
    let fnHtml = '<div class="footnotes-section"><p class="fn-title">Notes</p><ol>';
    for (const n of fnNums) {
      let txt = footnoteDefs[n].replace(zoteroRe, (_, t) => {
        const q = encodeURIComponent(t.replace(/[()[\]]/g, '').trim());
        return `<a href="https://scholar.google.com/scholar?q=${q}" target="_blank">${t}</a>`;
      });
      fnHtml += `<li id="fn-${n}" value="${n}">${txt} <a href="#fnref-${n}" class="fn-back">↩</a></li>`;
    }
    fnHtml += '</ol></div>';
    html += fnHtml;
  }

  // Inject HTML first — then walk DOM safely for entity highlighting
  const container = document.getElementById('reader-content');
  container.innerHTML = html;

  // Highlight entities using the first section's entity list
  const firstKey = container.querySelector('[data-section-key]')?.dataset.sectionKey;
  highlightEntitiesInDOM(container, firstKey);
}

// ═══════════════════════════════════════════════════════
//  DOM ENTITY HIGHLIGHTING  (TextNode TreeWalker — no regex on HTML)
//
//  Why TreeWalker and not innerHTML regex?
//  ─ Operates on text nodes AFTER the DOM is built → zero risk of breaking HTML
//  ─ Skips headings, code, footnotes, and already-wrapped spans automatically
//  ─ Section-aware: uses section_entities_map for contextual accuracy
//  ─ Anti-overlap via Uint8Array bitmap → no double-wrapping
// ═══════════════════════════════════════════════════════
function highlightEntitiesInDOM(container, sectionKey) {
  if (!state.graphData || !container) return;

  const sectionData = sectionKey ? state.sectionEntitiesMap?.[sectionKey] : null;

  // Build name→id map. Section entities are already sorted by occurrence_count.
  const nameToId = new Map();
  const sources  = sectionData?.entities
    || state.graphData.entities.map(e => ({ entity_id: e.id, entity_name: e.name }));

  for (const { entity_id, entity_name } of sources.slice(0, MAX_HIGHLIGHT)) {
    if (!entity_name || entity_name.length <= 3) continue;
    const entity = state.entityMap[entity_id];
    if (!entity) continue;
    const types = (entity.types || []).map(t => state.typeMap[t]);
    if (types.some(t => HIGHLIGHT_TYPES.has(t))) nameToId.set(entity_name, entity_id);
  }
  if (!nameToId.size) return;

  // Sort by length DESC so "Bitcoin Cash" is matched before "Bitcoin"
  const names = [...nameToId.keys()].sort((a, b) => b.length - a.length);

  // Tags whose text content must never be touched
  const SKIP_TAGS = new Set(['script','style','code','pre','sup','a','h1','h2','h3','h4','h5','h6']);

  const walker = document.createTreeWalker(
    container,
    NodeFilter.SHOW_TEXT,
    {
      acceptNode(node) {
        const p = node.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        if (SKIP_TAGS.has(p.tagName.toLowerCase()))  return NodeFilter.FILTER_REJECT;
        if (p.classList?.contains('entity-mention')) return NodeFilter.FILTER_REJECT;
        if (p.closest?.('.footnotes-section'))       return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    }
  );

  // Collect text nodes first (modifying the DOM while walking breaks the walker)
  const textNodes = [];
  let n;
  while ((n = walker.nextNode())) textNodes.push(n);

  for (const textNode of textNodes) {
    const frag = buildHighlightFragment(textNode.textContent, names, nameToId);
    if (frag && textNode.parentNode) textNode.parentNode.replaceChild(frag, textNode);
  }
}

/**
 * Scans `text` for entity names (longest-first), avoids overlaps via bitmap,
 * checks unicode-aware word boundaries, returns a DocumentFragment or null.
 */
function buildHighlightFragment(text, names, nameToId) {
  const occupied = new Uint8Array(text.length);
  const matches  = [];

  for (const name of names) {
    let idx = 0;
    while (idx <= text.length - name.length) {
      const pos = text.indexOf(name, idx);
      if (pos === -1) break;

      // Unicode word-boundary: char before/after must not be a word character
      const before = pos > 0                  ? text[pos - 1]              : ' ';
      const after  = pos + name.length < text.length ? text[pos + name.length] : ' ';
      const ok     = !/[\wÀ-öø-ÿ]/.test(before) && !/[\wÀ-öø-ÿ]/.test(after);

      if (ok) {
        // Check no byte already claimed by a longer match
        let free = true;
        for (let i = pos; i < pos + name.length; i++) { if (occupied[i]) { free = false; break; } }
        if (free) {
          for (let i = pos; i < pos + name.length; i++) occupied[i] = 1;
          matches.push({ start: pos, end: pos + name.length, name, id: nameToId.get(name) });
        }
      }
      idx = pos + name.length;
    }
  }

  if (!matches.length) return null;
  matches.sort((a, b) => a.start - b.start);

  const frag = document.createDocumentFragment();
  let pos = 0;
  for (const m of matches) {
    if (m.start > pos) frag.appendChild(document.createTextNode(text.slice(pos, m.start)));
    const span = document.createElement('span');
    span.className       = 'entity-mention';
    span.dataset.entityId = m.id;
    span.textContent      = m.name;
    span.addEventListener('click', () => openEntityPanel(m.id));
    frag.appendChild(span);
    pos = m.end;
  }
  if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
  return frag;
}

// ═══════════════════════════════════════════════════════
//  PARAGRAPH-LEVEL GRAPH UPDATE
//
//  Takes entity IDs found in the visible text blocks, expands with
//  1-hop neighbors (excluding structural types), caps at MAX_GRAPH_NODES.
//  Falls back to section top-N if the paragraph has too few entities.
// ═══════════════════════════════════════════════════════
let _paraTimer = null;
function debouncedUpdateGraphFromEntityIds(entityIds) {
  clearTimeout(_paraTimer);
  _paraTimer = setTimeout(() => updateGraphFromEntityIds(entityIds), 200);
}

const GRAPH_SKIP_TYPES = new Set(['Chapter','ThesisSection','SourceQuote','Reference','DoctoralThesis']);

function updateGraphFromEntityIds(entityIds) {
  if (!state.cy || !state.graphData) return;

  const seed = new Set(entityIds);

  // Expand with 1-hop neighbors up to MAX_GRAPH_NODES
  const expanded = new Set(seed);
  if (expanded.size < MAX_GRAPH_NODES) {
    // Collect candidate neighbors, deduplicated
    const seen = new Set(expanded);
    outer: for (const eid of seed) {
      for (const { nid } of (state.adjacency[eid] || [])) {
        if (seen.has(nid)) continue;
        seen.add(nid);
        const e = state.entityMap[nid];
        if (!e) continue;
        const types = (e.types || []).map(t => state.typeMap[t]);
        if (types.some(t => GRAPH_SKIP_TYPES.has(t))) continue;
        expanded.add(nid);
        if (expanded.size >= MAX_GRAPH_NODES) break outer;
      }
    }
  }

  // If still too few (paragraph had no/few entity mentions), supplement from section
  if (expanded.size < 4 && state.currentSectionKey && state.sectionEntitiesMap?.[state.currentSectionKey]) {
    // Add overrides first (pinned entities for this section)
    for (const eid of (state.sectionOverrides?.[state.currentSectionKey] || [])) {
      if (expanded.size >= MAX_GRAPH_NODES) break;
      expanded.add(eid);
    }
    // Then TF-IDF top entities
    const secScores = state.tfidfScores?.[state.currentSectionKey] || {};
    const sorted    = [...state.sectionEntitiesMap[state.currentSectionKey].entities]
      .sort((a, b) => (secScores[b.entity_id] || 0) - (secScores[a.entity_id] || 0));
    for (const { entity_id } of sorted) {
      if (expanded.size >= MAX_GRAPH_NODES) break;
      expanded.add(entity_id);
    }
  }

  // Build nodes — seed entities are visually larger (they're in the current text)
  const maxSize = 28, minSize = 14;
  const newNodes = [];
  for (const eid of expanded) {
    const entity = state.entityMap[eid];
    if (!entity) continue;
    const typeName = (entity.types || []).map(t => state.typeMap[t]).find(t => t) || 'Unknown';
    newNodes.push({
      data: {
        id:    eid,
        label: truncate(entity.name, 18),
        color: TYPE_COLORS[typeName] || '#6b5000',
        type:  typeName,
        size:  seed.has(eid) ? maxSize : minSize,
      }
    });
  }

  // Build edges only between nodes in the subgraph
  const newEdges = [];
  const edgeSet  = new Set();
  for (const r of state.graphData.relations) {
    if (expanded.has(r.from) && expanded.has(r.to)) {
      const key = `${r.from}|${r.to}|${r.type}`;
      if (!edgeSet.has(key)) {
        edgeSet.add(key);
        newEdges.push({ data: { id: key, source: r.from, target: r.to, label: state.relTypeMap[r.type] || '' } });
      }
    }
  }

  smoothUpdateGraph(newNodes, newEdges);

  document.getElementById('stat-nodes').textContent = `${newNodes.length} nœuds`;
  document.getElementById('stat-edges').textContent = `${newEdges.length} liens`;
  document.getElementById('graph-section-total').textContent =
    seed.size > 0 ? `${seed.size} entit${seed.size > 1 ? 'és' : 'é'} dans le passage` : '';
}

// ═══════════════════════════════════════════════════════
//  INTERSECTION OBSERVER — paragraph-level scrollytelling
//
//  Two observers:
//  1. headingObserver — tracks section key + TOC active state (coarse)
//  2. observer        — watches p/blockquote/li in a 40% central strip,
//     collects .entity-mention spans from visible blocks → paragraph-level
//     graph. Falls back to section top entities if the paragraph has none.
// ═══════════════════════════════════════════════════════
function setupIntersectionObserver() {
  if (state.observer)       state.observer.disconnect();
  if (state.headingObserver) state.headingObserver.disconnect();

  const readerCol = document.getElementById('reader-col');

  // ── 1. Heading observer: section key + TOC ──────────────────────────
  const headings = document.querySelectorAll('.reader-content [data-section-key]');
  if (headings.length) {
    state.headingObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          const key = entry.target.dataset.sectionKey;
          if (key) {
            state.currentSectionKey = key;
            document.getElementById('graph-section-name').textContent = key;
          }
          if (entry.target.dataset.section) updateTOCActive(entry.target.dataset.section);
        }
      }
    }, {
      root:       readerCol,
      rootMargin: '-5% 0px -85% 0px',
      threshold:  0,
    });
    for (const h of headings) state.headingObserver.observe(h);
  }

  // ── 2. Paragraph observer: entity-based graph ────────────────────────
  // We observe p, blockquote, li — each is a natural "thought unit"
  const blocks = document.querySelectorAll('.reader-content p, .reader-content blockquote, .reader-content li');
  if (!blocks.length) return;

  // Track which blocks are currently in the reading zone (closure-local Set)
  const visibleBlocks = new Set();

  state.observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting) visibleBlocks.add(entry.target);
      else                       visibleBlocks.delete(entry.target);
    }

    // Gather entity IDs from all .entity-mention spans in visible blocks
    const entityIds = new Set();
    for (const block of visibleBlocks) {
      block.querySelectorAll('.entity-mention[data-entity-id]')
        .forEach(s => entityIds.add(s.dataset.entityId));
    }

    // Always update: if 0 entity spans in zone, updateGraphFromEntityIds
    // falls back to section top entities (never leaves graph empty)
    debouncedUpdateGraphFromEntityIds([...entityIds]);
  }, {
    root:       readerCol,
    rootMargin: '-30% 0px -30% 0px',  // central 40% strip = "reading zone"
    threshold:  0,
  });

  for (const b of blocks) state.observer.observe(b);
}

// ═══════════════════════════════════════════════════════
//  TOC
// ═══════════════════════════════════════════════════════
function buildTOC() {
  const headings = document.querySelectorAll('.reader-content h1, .reader-content h2');
  const toc = document.getElementById('toc-content');
  toc.innerHTML = '';
  for (const h of headings) {
    const isH1 = h.tagName === 'H1';
    const div  = document.createElement('div');
    div.className       = isH1 ? 'toc-chapter' : 'toc-section';
    div.textContent     = h.textContent.slice(0, 55) + (h.textContent.length > 55 ? '…' : '');
    div.dataset.target  = h.id;
    div.onclick         = () => h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    toc.appendChild(div);
  }
}

function updateTOCActive(sectionName) {
  const slug = 'section-' + slugify(sectionName);
  document.querySelectorAll('.toc-chapter, .toc-section').forEach(el => {
    el.classList.toggle('active', el.dataset.target === slug);
  });
}

// ═══════════════════════════════════════════════════════
//  CHAPTER NAV
// ═══════════════════════════════════════════════════════
function renderChapterNav() {
  const nav = document.getElementById('chapter-nav');
  nav.innerHTML = '';
  for (const ch of CHAPTERS_DEF) {
    const btn    = document.createElement('button');
    btn.className = 'ch-btn';
    btn.id        = 'ch-' + ch.id;
    btn.textContent = state.lang === 'en' ? ch.labelEN : ch.labelFR;
    btn.onclick     = () => loadChapter(ch.id);
    nav.appendChild(btn);
  }
}

function updateChapterNav() {
  for (const ch of CHAPTERS_DEF) {
    const btn = document.getElementById('ch-' + ch.id);
    if (btn) {
      btn.classList.toggle('active', ch.id === state.currentChapter);
      btn.textContent = state.lang === 'en' ? ch.labelEN : ch.labelFR;
    }
  }
}

// ═══════════════════════════════════════════════════════
//  LANGUAGE TOGGLE
// ═══════════════════════════════════════════════════════
function setLang(lang) {
  state.lang = lang;
  document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.documentElement.dataset.lang = lang;
  updateChapterNav();
  loadChapter(state.currentChapter);
}

// ═══════════════════════════════════════════════════════
//  FILTERS
// ═══════════════════════════════════════════════════════
function renderFilters(types) {
  const container = document.getElementById('graph-filters');
  container.innerHTML = '';
  for (const typeName of [...types].sort()) {
    const color = TYPE_COLORS[typeName] || '#6b5000';
    const chip  = document.createElement('div');
    chip.className       = 'filter-chip on';
    chip.textContent     = typeName;
    chip.style.borderColor = color;
    chip.style.color       = color;
    chip.dataset.type      = typeName;
    chip.onclick = () => {
      const isOn = chip.classList.toggle('on');
      if (isOn) state.activeFilters.add(typeName);
      else      state.activeFilters.delete(typeName);
      applyFilters();
    };
    container.appendChild(chip);
  }
}

function applyFilters() {
  if (!state.cy) return;
  state.cy.nodes().forEach(node => {
    if (state.activeFilters.has(node.data('type'))) node.removeClass('hidden-filter');
    else                                             node.addClass('hidden-filter');
  });
}

// ═══════════════════════════════════════════════════════
//  GRAPH HIGHLIGHT / FOCUS
// ═══════════════════════════════════════════════════════
function highlightNeighbors(id) {
  if (!state.cy) return;
  state.cy.elements().addClass('faded').removeClass('highlighted');
  const node = state.cy.getElementById(id);
  node.addClass('highlighted').removeClass('faded');
  node.neighborhood().addClass('highlighted').removeClass('faded');
}

function clearHighlight() {
  if (!state.cy) return;
  state.cy.elements().removeClass('faded highlighted');
}

function focusNodeInGraph(entityId) {
  if (!state.cy) return;
  const node = state.cy.getElementById(entityId);
  if (!node.length) return;
  state.cy.animate(
    { center: { eles: node }, zoom: Math.max(state.cy.zoom(), 1.6) },
    { duration: 350 }
  );
  highlightNeighbors(entityId);
}

// ═══════════════════════════════════════════════════════
//  ENTITY PANEL
// ═══════════════════════════════════════════════════════
function openEntityPanel(entityId) {
  const e = state.entityMap[entityId];
  if (!e) return;

  const typeName = (e.types || []).map(t => state.typeMap[t]).find(t => t) || '?';
  const color    = TYPE_COLORS[typeName] || '#6b5000';

  document.getElementById('panel-name').textContent = e.name;
  const typeEl = document.getElementById('panel-type');
  typeEl.textContent     = typeName;
  typeEl.style.borderColor = color;
  typeEl.style.color       = color;

  document.getElementById('panel-desc').textContent = e.description?.value || '—';

  // Key attributes
  const attrsEl    = document.getElementById('panel-attrs');
  attrsEl.innerHTML = '';
  const SKIP_ATTRS  = new Set(['titleFr','titleEn','titleOriginal','sourceFile',
    'sourcePage','pdfPage','page','pageRef','pdfQuote']);
  const attrs = Object.entries(e.attributes || {})
    .filter(([k]) => !SKIP_ATTRS.has(k))
    .filter(([, v]) => { const t = typeof v === 'object' ? v?.value : v; return t && String(t).length > 0; });
  if (attrs.length) {
    attrsEl.className = 'panel-attrs';
    for (const [key, val] of attrs) {
      const text = typeof val === 'object' ? (val.value || '') : String(val);
      if (!text) continue;
      const block = document.createElement('div');
      block.className = 'panel-attr-block';
      block.innerHTML = `<span class="panel-attr-key">${key.replace(/_/g,' ')}</span>${text}`;
      attrsEl.appendChild(block);
    }
  }

  // Relations
  const relsEl   = document.getElementById('panel-relations');
  relsEl.innerHTML = '';
  const neighbors  = state.adjacency[entityId] || [];
  for (const { nid, relName, dir } of neighbors.slice(0, 30)) {
    const ne = state.entityMap[nid];
    if (!ne) continue;
    const div = document.createElement('div');
    div.className = 'panel-relation';
    div.innerHTML = `
      <span class="rel-arrow">${dir === 'out' ? '→' : '←'}</span>
      <span class="rel-type">${relName}</span>
      <span class="rel-target">${ne.name}</span>
    `;
    div.onclick = () => openEntityPanel(nid);
    relsEl.appendChild(div);
  }
  if (neighbors.length > 30) {
    const more = document.createElement('p');
    more.style.cssText  = 'font-size:0.75em;color:var(--text2);padding-top:8px;';
    more.textContent    = `+ ${neighbors.length - 30} autres relations`;
    relsEl.appendChild(more);
  }

  document.getElementById('entity-panel').classList.add('open');
  // Simultaneously focus the node in the graph
  focusNodeInGraph(entityId);
}

function closePanel() {
  document.getElementById('entity-panel').classList.remove('open');
  clearHighlight();
}

// ═══════════════════════════════════════════════════════
//  READING PROGRESS BAR
// ═══════════════════════════════════════════════════════
function initReadingProgress() {
  const col = document.getElementById('reader-col');
  const bar = document.getElementById('reading-progress');
  if (!col || !bar) return;
  col.addEventListener('scroll', () => {
    const pct = col.scrollHeight > col.clientHeight
      ? (col.scrollTop / (col.scrollHeight - col.clientHeight)) * 100
      : 0;
    bar.style.width = pct + '%';
  });
}

// ═══════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════
function normalize(str) {
  return (str || '').toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ');
}

function slugify(str) {
  return normalize(str).replace(/\s+/g, '-').slice(0, 60);
}

function truncate(str, n) {
  return str.length > n ? str.slice(0, n) + '…' : str;
}

// ═══════════════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
});

// ═══════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════
init();
</script>
