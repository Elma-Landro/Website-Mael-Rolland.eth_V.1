name: check

# Filet de securite minimal, sans dependance : syntaxe JS, validite JSON,
# integrite structurelle du graphe, coherence de la couche d'ancrage.
#
# Motive par l'historique reel du depot :
#   - deux commits de reparation de syntaxe sur story-presets.mjs
#     (apostrophes typographiques dans des chaines a quotes simples) ;
#   - 15 relations a identifiant tronque ayant survecu cinq versions du graphe ;
#   - 26 identifiants morts dans section_entities_map passes a travers
#     quatre versions sans que rien ne les remarque ;
#   - un __pycache__ commite par inadvertance.
#
# Rien ici n'installe quoi que ce soit : Node et Python 3 suffisent.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe JavaScript
        run: |
          set -e
          shopt -s nullglob
          fichiers=(*.mjs *.js scripts/*.mjs export/scripts/*.mjs)
          echo "${#fichiers[@]} fichier(s) a verifier"
          for f in "${fichiers[@]}"; do
            node --check "$f" && echo "  OK  $f"
          done

      - name: Validite JSON
        run: |
          set -e
          for f in *.json docs/audits/data/*.json patches/*.json; do
            [ -e "$f" ] || continue
            python3 -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" \
              && echo "  OK  $f"
          done

      # Une seule relation cassee est connue et DELIBEREMENT conservee :
      # `9dee2daa…`, dont le `from` `72d182705407492c` est un identifiant
      # tronque renvoyant a Ostrom 1990. Elle est portee, signalee, depuis mai
      # 2026 en attente d'arbitrage humain — c'est une preuve de conservatisme,
      # pas un defaut a masquer. On l'inscrit donc nommement en tolerance.
      #
      # Seul le graphe le plus recent est bloquant. Les versions anterieures
      # sont des instantanes geles : v96 porte encore 15 endpoints casses,
      # corriges des v97. Les faire echouer rendrait la CI rouge pour un etat
      # que personne ne compte reparer. Elles restent verifiees, en rapport.
      #
      # Ce controle vivait ici, en Python embarque. Il en est sorti : du code
      # qui n'existe que dans un YAML ne s'execute qu'en CI, donc ne se
      # verifie jamais avant d'etre pousse — et il a livre une KeyError sur
      # une ligne d'affichage. Un fichier appelable se rejoue en local.
      - name: Integrite structurelle du graphe
        run: python3 scripts/check_graph_integrity.py

      - name: Coherence de la couche d'ancrage
        run: python3 scripts/check_anchoring.py

      # Les champs snippet_status / direct_anchor_count de la carte doivent
      # suivre les MD, la carte des titres et les noms d'entites : sans ce
      # controle, ils perimeraient en silence au premier changement.
      - name: Poids d'ancrage a jour
        run: python3 scripts/build_anchor_weights.py --check

      # Fraicheur du registre des proprietes (arbitrage Q5-a du 2026-08-07) :
      # la CI ne verifie par ailleurs que la PRESENCE des cles au registre,
      # jamais domain/count — sans ce controle, un registre perime resterait
      # silencieusement vert (le trou mis au jour par le preflight lab).
      - name: Registre des proprietes a jour
        run: python3 scripts/build_properties_registry.py --check

      # Preflight des patchs candidats (arbitrage Q5-b) : policy CANDIDATE
      # conservee, entityIds vivants, comptes exacts, pas de chaine
      # duplicateOf — un candidat qui perime ou perd son marquage doit se
      # voir avant tout merge, pas au moment d'une application.
      - name: Preflight des patchs candidats
        run: python3 scripts/preflight_candidate_patches.py

      # CI SOUPLE (arbitrage de l'auteur du 2026-08-09, Q5). On verifie que
      # les outils de file TOURNENT et sont DETERMINISTES — pas que le CSV
      # versionne colle au graphe courant. Une CI stricte rougirait a chaque
      # bump de version pour garder ZERO artefact applicable (les deux qui le
      # sont techniquement sont bloques par arbitrage). Le modele strict est
      # la cible une fois la transition current/snapshot/ledger faite.
      #
      # On compare les ARTEFACTS produits, pas les resumes. Une premiere
      # version de cette etape ne diffait que le `stdout`, qui ne porte que des
      # compteurs : un non-determinisme confine a une colonne du CSV serait
      # passe au vert. Et le ledger n'y tournait qu'UNE fois alors que le
      # message annonçait trois sorties deterministes.
      #
      # Les fichiers versionnes sont restaures a la fin : cette etape ne
      # verifie PAS leur fraicheur (ce serait le modele strict), donc elle ne
      # doit rien laisser derriere elle qui ressemble a un verdict.
      - name: File de patchs — les outils tournent et sont deterministes
        run: |
          set -euo pipefail
          suivis="docs/audits/data/patch-application-queue-current.csv
                  docs/audits/data/patch-queue-governance-cases-current.csv
                  patch-application-ledger.json"
          verifier() {  # $1 = commande d ecriture, $2 = fichier produit
            $1 > /dev/null && cp "$2" /tmp/passe1
            $1 > /dev/null && cp "$2" /tmp/passe2
            diff -q /tmp/passe1 /tmp/passe2 \
              && echo "  deterministe : $2"
          }
          verifier "python3 scripts/build_patch_queue_inventory.py --csv" \
                   docs/audits/data/patch-application-queue-current.csv
          verifier "python3 scripts/build_patch_queue_governance.py --csv" \
                   docs/audits/data/patch-queue-governance-cases-current.csv
          verifier "python3 scripts/build_patch_application_ledger.py --write" \
                   patch-application-ledger.json
          git checkout -- $suivis
          echo "file, gouvernance et ledger : trois artefacts regeneres deux"
          echo "fois, contenus identiques ; fichiers versionnes restaures"


      - name: Recapitulatif
        if: always()
        run: |
          echo "audit_graph.py et check_anchoring.py sont rejouables en local :"
          echo "  python3 scripts/audit_graph.py --input <graphe>"
          echo "  python3 scripts/check_anchoring.py"
          echo "  python3 scripts/check_anchoring.py --no-baseline   # dette comprise"
